name: Chart Predictor PRO V3 - Public APK
on:
  push:
    branches: [chart-predictor-pro-apk-download]
    paths:
      - 'ChartPredictorPro/**'
      - '.github/workflows/chart-predictor-pro-public-v3.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR=$(find "$SDKROOT/cmdline-tools" -name sdkmanager -type f | head -1)
          test -n "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Generate 24 HD offline educational charts
        run: |
          python3 -m pip install --quiet --user Pillow
          python3 ChartPredictorPro/tools/generate_offline_pattern_gallery.py
          test "$(find ChartPredictorPro/app/src/main/assets/patterns -name 'pattern_*.png' | wc -l)" -eq 24
      - name: Build Android APK
        working-directory: ChartPredictorPro
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Publish V3 APK in public repository
        run: |
          APK=ChartPredictorPro/app/build/outputs/apk/debug/app-debug.apk
          SIZE=$(stat -c%s "$APK")
          echo "APK_BYTES=$SIZE"
          test "$SIZE" -ge 1048576
          cp "$APK" downloads/ChartPredictorPro-V3-5MB.apk
          sha256sum downloads/ChartPredictorPro-V3-5MB.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f downloads/ChartPredictorPro-V3-5MB.apk
          git commit -m "Publish Chart Predictor PRO V3 APK with 24 offline HD patterns [skip ci]"
          git push origin HEAD:chart-predictor-pro-apk-download
